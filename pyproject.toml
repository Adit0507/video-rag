[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "youtube-transcript-api>=1.2,<2",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
videorag = "rag.cli:main"          

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]            

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]                 
markers = ["live: hits real YouTube; run with RUN_LIVE=1"]